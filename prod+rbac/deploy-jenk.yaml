apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-deploy
  namespace: obi-ns
    
spec:
  replicas: 6
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins-cont
          image: jenkins/jenkins:lts
          ports:
            - containerPort: 8080
              name: http
